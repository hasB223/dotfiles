#--------------------------------------------------------------------------
# Configuration
#--------------------------------------------------------------------------

# Use Vi mode
setw -g mode-keys vi

# Increase scrollback buffer size 
set -g history-limit 10000

# Start window and pane numbering from 1 for easier switching
set -g base-index 1
setw -g pane-base-index 1

# Allow automatic renaming of windows
set -g allow-rename on

# Renumber windows when one is removed.
set -g renumber-windows on

# Improve colors
set -g default-terminal "${TERM}"

# Enable undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'

# Enable undercurl colors
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Allow the mouse to resize windows and select tabs
set -g mouse on

# Allow tmux to set the terminal title
set -g set-titles on

# Monitor window activity to display in the status bar
setw -g monitor-activity on

# A bell in another window should cause a bell in the current window
set -g bell-action any

# Don't show distracting notifications
set -g visual-bell off
set -g visual-activity off

# Focus events enabled for terminals that support them
set -g focus-events on

# Useful when using sharing a session with different size terminals
setw -g aggressive-resize on

# don't detach tmux when killing a session
set -g detach-on-destroy off

# address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

#--------------------------------------------------------------------------
# Status line
#--------------------------------------------------------------------------
# Status line is themed by catppuccin/tmux - see the Plugins section below.
# Length limits still apply regardless of theme.
set-option -g status-left-length 100
set-option -g status-right-length 100

#--------------------------------------------------------------------------
# Key Bindings
#--------------------------------------------------------------------------

# -r means that the bind can repeat without entering prefix again
# -n means that the bind doesn't use the prefix

# Set the prefix to Ctrl+Space
set -g prefix C-Space

# Send prefix to a nested tmux session by doubling the prefix
bind C-Space send-prefix

# 'PREFIX r' to reload of the config file
unbind r
bind r source-file ~/.tmux.conf\; display-message '~/.tmux.conf reloaded'

# Allow holding Ctrl when using using prefix+p/n for switching windows
bind C-p previous-window
bind C-n next-window

# Move around panes like in vim
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Smart pane switching with awareness of vim splits
is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?)(diff)?$"'
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Switch between previous and next windows with repeatable
bind -r n next-window
bind -r p previous-window

# Move the current window to the next window or previous window position
bind -r N run-shell "tmux swap-window -t $(expr $(tmux list-windows | grep \"(active)\" | cut -d \":\" -f 1) + 1)"
bind -r P run-shell "tmux swap-window -t $(expr $(tmux list-windows | grep \"(active)\" | cut -d \":\" -f 1) - 1)"

# Switch between two most recently used windows
bind Space last-window

# Switch between two most recently used sessions
bind ^ switch-client -l

# use PREFIX+| (or PREFIX+\) to split window horizontally and PREFIX+- or
# (PREFIX+_) to split vertically also use the current pane path to define the
# new pane path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Change the path for newly created windows
bind c new-window -c "#{pane_current_path}"

# Setup 'v' to begin selection as in Vim
if-shell -b '[ "$(echo "$TMUX_VERSION >= 2.4" | bc)" = 1 ]' \
    'bind-key -T copy-mode-vi v send-keys -X begin-selection;'

bind-key -r F new-window t
bind-key -r D run-shell "t ~/Documents/Codes"

# Detach - the stock 'prefix d' default was reassigned below (lazydocker
# popup), so it needs an explicit rebind.
bind-key Q detach-client

# Companion DevOps TUI launchers - open in a popup over the current pane,
# closes automatically on exit (-E), starts in the pane's cwd (-d).
bind-key g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind-key K display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "k9s"
bind-key d display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazydocker"

#--------------------------------------------------------------------------
# Plugins (tpm - https://github.com/tmux-plugins/tpm)
#--------------------------------------------------------------------------
# Install/update: prefix + I  |  Remove unused: prefix + alt-u

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# System clipboard integration (y in copy-mode). Auto-detects pbcopy/xclip/
# wl-copy per OS, so this works unchanged on a future linux/wsl branch too -
# replaces a hand-rolled xclip-only bind that only worked on Linux.
set -g @plugin 'tmux-plugins/tmux-yank'

# Session persistence across reboots / SSH drops.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Status line theme - https://github.com/catppuccin/tmux
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'

run '~/.tmux/plugins/tpm/tpm'

# Status line composition - must load AFTER the tpm run line above:
# catppuccin only provides the color palette + module snippets (not a
# default status-left/right layout, that's on us to compose), and at least
# one other plugin resets status-right/left as a side effect of its own
# load, so anything set before `run tpm/tpm` gets clobbered. Kept to modules
# with no extra binary/plugin dependency (skipped cpu/ram/battery, which
# need tmux-cpu/tmux-battery, and kube/gitmux, which need kubectx/gitmux
# installed separately).
#
# Plain `-a` (not `-agF`) deliberately: tpm loads plugin scripts in the
# background, so force-expanding (`-F`) here would race catppuccin's
# variables and can bake in an empty value. A live (unforced) reference
# just re-evaluates on every status-bar refresh instead, sidestepping the
# race entirely.
set -g status-left ""
set -ag status-left "#{E:@catppuccin_status_session}"

set -g status-right ""
set -ag status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
